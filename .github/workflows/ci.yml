name: CI

# SPEC §8: everything except the 10M-hand simulation runs on each push;
# the simulation runs nightly and on release branches.
on:
  push:
    branches: ['**']
  pull_request:
  # The simulation job below keys off this. Without a schedule trigger its
  # `github.event_name == 'schedule'` condition can never become true.
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  simulation:
    # 10 million hands of perfect basic strategy; asserts the house edge lands
    # in 0.35%-0.55%. Roughly three minutes, so not on every push.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run sim --workspace @bj/engine
