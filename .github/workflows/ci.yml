name: CI

# SPEC §8: everything except the 10M-hand simulation runs on each push;
# the simulation runs nightly and on release branches.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  simulation:
    # 10 million hands of perfect basic strategy; asserts the house edge lands
    # in 0.35%-0.55%. Too slow for every push.
    #
    # NOTE: the `sim` script lands with M2 — it needs the strategy tables to have
    # something to simulate. This job is gated off until then and will not run on
    # a normal push.
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run sim --workspace @bj/engine
